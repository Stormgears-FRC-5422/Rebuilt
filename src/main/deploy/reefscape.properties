##########
# Subsystem Toggles - turn on or off in specific robot files
##########
toggles.useDrive = (boolean) true
toggles.useShooter = (boolean) false
toggles.useLights = (boolean) false
# We generally expect this to be false when running an outreach event, and only true for testing
toggles.useAdvantageKit=(boolean) true
toggles.usePidTuner = (boolean) true

##########
# Controls and buttons
#########
#buttonBoard.driveJoystick = (String) LogitechController
buttonBoard.drivePort = (int) 0
buttonBoard.squarePath = (boolean) false

##########
# Physical constants
##########
# Frame dimensions in inches: 28"L x 32"W
frame.lengthInches = (number) 28.0
frame.widthInches = (number) 32.0

# Drivetrain dimensions in inches
drive.trackwidthInches = (number) 22.75
drive.wheelbaseInches = (number) 26.75

##########
# IMU Configuration
##########
imu.type = (String) Pigeon2
imu.inverted = (boolean) false
imu.pigeonID = (int) 0
imu.canBusName = (String) Drivetrain

# CTRE-specific current limits
talonConstants.driveStatorCurrentLimit = (number) 80
talonConstants.steerStatorCurrentLimit = (number) 40

##########
# Drive
##########

drive.driveType = (String) BasicSwerve
#drive.driveType = (String) DiagnosticSwerve
drive.driveSubtype = (String) none

# Hardware configuration for Rebuilt robot (TalonFX/Pigeon2)
drive.moduleType = (String) TalonFX
drive.canBusName = (String) Drivetrain

##########
# all the CAN IDs - these need to match settings in Swerve .json files
##########

drive.driveRatio = (number) 6.750
drive.steerRatio = (number) 21.429

# EncoderOffsets should be the value the cancoder reads when in the true forward position
# using the convention that the bevel gears on the swerve face each other on the inside of the robot
# Offsets are in rotations (as read from Phoenix Tuner)
drive.frontLeftEncoderID = (int) 1
drive.frontLeftEncoderOffsetRotations = (number) 0.1459961
drive.frontLeftDriveID = (int) 11
drive.frontLeftSteerID = (int) 10

drive.frontRightEncoderID = (int) 2
drive.frontRightEncoderOffsetRotations = (number) -0.2214361
drive.frontRightDriveID = (int) 21
drive.frontRightSteerID = (int) 20

drive.backRightEncoderID = (int) 3
drive.backRightEncoderOffsetRotations = (number) 0.2726606
drive.backRightDriveID = (int) 31
drive.backRightSteerID = (int) 30

drive.backLeftEncoderID = (int) 4
drive.backLeftEncoderOffsetRotations = (number) 0.3476561
drive.backLeftDriveID = (int) 41
drive.backLeftSteerID = (int) 40

# Wheel diameter is in inches!
drive.frontLeftDiameter = (number) 4.0
drive.frontRightDiameter = (number) 4.0
drive.backRightDiameter = (number) 4.0
drive.backLeftDiameter = (number) 4.0

drive.driveKP = (number) 0.0
drive.driveKI = (number) 0.0
drive.driveKD = (number) 0.0
drive.driveKA = (number) 0.0
drive.driveKMin = (number) -0.3
drive.driveKMax = (number) 0.3

drive.steerKP = (number) 1.44
drive.steerKI = (number) 0.0
drive.steerKD = (number) 0.036
drive.steerKA = (number) 0.0
drive.steerKMin = (number) -0.3
drive.steerKMax = (number) 0.3

drive.driveOpenLoopRampRate = (number) 0.2
drive.steerOpenLoopRampRate = (number) 0.2

# otherwise invertLeft
drive.invertRight = (boolean) true
drive.invertSteer = (boolean) true
drive.invertEncoder = (boolean) false

drive.driveCoastMode = (boolean) true
drive.steerCoastMode = (boolean) true

