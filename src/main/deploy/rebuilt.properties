# Current limits (roller — TalonFX stator + supply)
intake.rollerStatorCurrentLimit = (number) 80.0
intake.rollerSupplyCurrentLimit = (number) 80.0

# PID gains for MotionMagicVoltage control
# Units: output is Volts, error is mechanism rotations (after 53.33:1 ratio)
# kP: V per mechanism rotation of error (80 V/rot = 0.22 V/degree)
# kI: V per mechanism rotation-second of accumulated error
# kD: V per mechanism rotation/second of error velocity
# kG: V gravity feedforward (use with Arm_Cosine gravity type)
# kS: V static friction feedforward
intake.kP = (number) 80.0
# I HAS to stay 0
intake.kI = (number) 0.0
intake.kD = (number) 0.5
intake.kG = (number) 0.0
intake.kS = (number) 0.20


# MotionMagic profile constraints (units: mechanism rotations)
# cruiseVelocity: mechanism rot/s (0.5 rot/s = 180 deg/s, motor ~1600 RPM)
# acceleration:   mechanism rot/s^2 (2.0 = reaches cruise in 0.25s)
# jerk:           mechanism rot/s^3 (20.0 = smooth S-curve, 0.1s accel ramp)
# Profile: 150 deg in ~1.08s with trapezoidal approximation
intake.cruiseVelocity = (number) 1
intake.acceleration = (number) 2.0
intake.jerk = (number) 20.0

# Slower MotionMagic profile for manual (joystick) control
intake.manualCruiseVelocity = (number) 0.6
intake.manualAcceleration = (number) 1.0
intake.manualJerk = (number) 10.0

# Simple motion voltage
intake.updownVolts = (number) -2.0hy7
intake.cruiseAngleDegrees = (number) 105.0

# Roller speeds (arm must be past minRollerHeight degrees before roller runs)
