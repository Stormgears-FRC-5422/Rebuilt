drive.steerKA_foc = (number) 0.0
drive.steerKMin_foc = (number) -0.5
drive.steerKMax_foc = (number) 0.5


# otherwise invertLeft
drive.invertRight = (boolean) true
drive.invertSteer = (boolean) true
drive.invertEncoder = (boolean) false

drive.driveCoastMode = (boolean) true
